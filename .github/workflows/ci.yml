name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Shared & UI Packages
        run: |
          pnpm --filter @cab-app/shared build
          pnpm --filter @cab-app/ui build

      - name: Run Unit Tests
        run: pnpm --filter @cab-app/shared test

      - name: Typecheck
        run: pnpm typecheck
