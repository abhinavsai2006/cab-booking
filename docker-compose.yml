version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cab-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cab_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cab-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cab-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cab_app?schema=public"
      REDIS_URL: "redis://redis:6379"
      DEMO_MODE: "true"
      NODE_ENV: "production"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cab-web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:4000"
      DEMO_MODE: "true"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
